<header class="site-header" [class.scrolled]="scrolled() || leadershipPage()" #siteHeader>
  <a class="brand" routerLink="/" fragment="home" aria-label="Mar Thoma Dhyanatheeram home">
    <img class="brand-logo" src="assets/dhyanatheeram-logo-transparent.png" alt="Mar Thoma Dhyanatheeram" width="2164" height="727">
  </a>
  <button class="menu-button" aria-controls="site-nav" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()" #menuButton>
    <span></span><span></span><span></span><span class="sr-only">Open menu</span>
  </button>
  <nav id="site-nav" class="site-nav" [class.open]="menuOpen()" (click)="onNavClick($event)">
    <a routerLink="/" fragment="about">About</a>
    <a routerLink="/" fragment="facilities">Facilities</a>
    <a routerLink="/leadership" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Leadership</a>
    <a routerLink="/" fragment="location">Location</a>
    <a routerLink="/" fragment="contact">Contact</a>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer>

    <div class="contact-top">
      <p class="eyebrow">Visit · Connect</p>

    </div>
    <div class="contact-grid">
      <div>
        <span class="contact-label">Bookings &amp; enquiries</span>
        <a href="tel:+918547799080">+91 85477 99080</a>
        <a href="tel:+917559003146">+91 75590 03146</a>
      </div>
      <div>
        <span class="contact-label">Write</span>
        <a class="contact-email" href="mailto:marthomadhyanatheeram@gmail.com">marthomadhyanatheeram&#64;gmail.com</a>
      </div>
    </div>
    <div class="contact-footer">
      <a class="brand" routerLink="/" fragment="home" aria-label="Mar Thoma Dhyanatheeram home"><img class="brand-logo" src="assets/dhyanatheeram-logo-transparent.png" alt="Mar Thoma Dhyanatheeram" width="2164" height="727" loading="lazy"></a>
      <p>© {{ year() }} Mar Thoma Dhyanatheeram</p>
    </div>
  </section>
</footer>
